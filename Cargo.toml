[package]
name = "beacon-server"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# WebAssembly Spin SDK (WASI 0.2 HTTP handler)
spin-sdk = "3.0.0"

# Serialization & JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography for ephemeral tokens (100% pure Rust, zero-syscall WASM compatible)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Date and time for timestamps
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

# UUID validation
uuid = { version = "1.8", features = ["v4", "serde"] }
