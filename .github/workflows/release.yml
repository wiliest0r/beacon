name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
  repository_dispatch:
    types: [ web_tag_released ]

jobs:
  build-and-release:
    name: Build, Release & Publish OCI
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Beacon
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-wasip1

      - name: Install binaryen (wasm-opt) & ORAS
        run: |
          sudo apt-get update && sudo apt-get install -y binaryen

      - name: Setup ORAS
        uses: oras-project/setup-oras@v1

      - name: Download Latest Web Tag Bundle (Sync)
        run: |
          mkdir -p static
          curl -sL https://github.com/${{ github.repository_owner }}/web-tag/releases/latest/download/t.min.js -o static/t.min.js || true

      - name: Build WASM Release
        run: cargo build --release --target wasm32-wasip1

      - name: Optimize WASM Binary
        run: |
          wasm-opt -Oz target/wasm32-wasip1/release/beacon_server.wasm -o target/wasm32-wasip1/release/beacon_server-opt.wasm

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG="${{ github.event.client_payload.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v0.1.0"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.release_tag }}
          name: Release ${{ steps.vars.outputs.release_tag }}
          files: target/wasm32-wasip1/release/beacon_server-opt.wasm
          generate_release_notes: true

      - name: Log In to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish WASM to GHCR OCI
        run: |
          IMAGE_TAG="${{ steps.vars.outputs.release_tag }}"
          WASM_FILE="target/wasm32-wasip1/release/beacon_server-opt.wasm"
          TARGET_REF="ghcr.io/${{ github.repository_owner }}/beacon-wasm:$IMAGE_TAG"
          LATEST_REF="ghcr.io/${{ github.repository_owner }}/beacon-wasm:latest"

          echo "Publishing to $TARGET_REF and $LATEST_REF..."
          oras push "$TARGET_REF" \
            --artifact-type application/vnd.module.wasm.content.layer.v1+wasm \
            "$WASM_FILE":application/vnd.module.wasm.content.layer.v1+wasm

          oras push "$LATEST_REF" \
            --artifact-type application/vnd.module.wasm.content.layer.v1+wasm \
            "$WASM_FILE":application/vnd.module.wasm.content.layer.v1+wasm
