name: Build, Release & Deliver WASM to GKE

on:
  push:
    branches: [ develop ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stage
          - prod
  repository_dispatch:
    types: [ web_tag_released, web_tag_updated ]

permissions:
  contents: write
  id-token: write

jobs:
  build-and-deliver:
    name: Build WASM & Deploy to GKE
    runs-on: ubuntu-24.04
    environment: ${{ inputs.target_env || 'dev' }}

    steps:
      - name: Checkout Beacon
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout Web Tag
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/web-tag
          ref: develop
          path: tmp-web-tag

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build Web Tag Bundle
        run: |
          cd tmp-web-tag
          npm ci || npm install
          npm run build
          mkdir -p ../static
          cp dist/t.min.js ../static/t.min.js
          TAG_VER=$(node -p "require('./package.json').version")
          TAG_SHA=$(git rev-parse --short HEAD)
          cd ..
          echo "TAG_VER=$TAG_VER" >> $GITHUB_ENV
          echo "TAG_SHA=$TAG_SHA" >> $GITHUB_ENV

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-wasip1

      - name: Install binaryen (wasm-opt)
        run: |
          sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build WASM Release
        run: cargo build --release --target wasm32-wasip1

      - name: Optimize WASM Binary
        run: |
          wasm-opt -Oz target/wasm32-wasip1/release/beacon_server.wasm -o target/wasm32-wasip1/release/beacon_server-opt.wasm
          BEACON_VER=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          BEACON_SHA=$(git rev-parse --short HEAD)
          echo "BEACON_VER=$BEACON_VER" >> $GITHUB_ENV
          echo "BEACON_SHA=$BEACON_SHA" >> $GITHUB_ENV

      - name: Determine Composite Tag (Strategy 1)
        id: tagger
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            DISPATCH_TAG="${{ github.event.client_payload.tag }}"
            TAG="v${BEACON_VER}-tag.${DISPATCH_TAG#v}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}-tag.${TAG_VER}"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            TAG="dev-b${BEACON_SHA}-t${TAG_SHA}"
          else
            TAG="v${BEACON_VER}-tag.${TAG_VER}"
          fi
          echo "composite_tag=$TAG" >> $GITHUB_OUTPUT
          echo "COMPOSITE_TAG=$TAG" >> $GITHUB_ENV
          echo "Resolved Composite Tag: $TAG"

      - name: Authenticate to Google Cloud (OIDC WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK & GKE Auth Plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Configure Docker for Google Artifact Registry
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and Push Docker OCI Image
        run: |
          IMAGE_URI="${{ vars.GCP_GAR_REPOSITORY }}:${{ steps.tagger.outputs.composite_tag }}"
          LATEST_DEV="${{ vars.GCP_GAR_REPOSITORY }}:latest-dev"

          echo "Building image: $IMAGE_URI"
          docker build -t "$IMAGE_URI" -t "$LATEST_DEV" .

          echo "Pushing image to Artifact Registry..."
          docker push "$IMAGE_URI"
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            docker push "$LATEST_DEV"
          fi

      - name: Authenticate GKE & Rollout (Dev Auto-Deploy)
        if: github.ref == 'refs/heads/develop' || github.event_name == 'repository_dispatch' || github.event.inputs.target_env == 'dev'
        env:
          USE_GKE_GCLOUD_AUTH_PLUGIN: 'True'
        run: |
          echo "Obtaining GKE cluster credentials..."
          gcloud container clusters get-credentials ${{ vars.GKE_CLUSTER_NAME }} \
            --zone ${{ vars.GKE_ZONE }} \
            --project ${{ vars.GCP_PROJECT_ID }}

          echo "Updating Kubernetes deployment..."
          kubectl set image deployment/beacon-server beacon-server=${{ vars.GCP_GAR_REPOSITORY }}:${{ steps.tagger.outputs.composite_tag }} -n beacon

          echo "Waiting for rollout to complete..."
          kubectl rollout status deployment/beacon-server -n beacon --timeout=180s

          echo "Verifying Live Endpoint..."
          LB_IP=$(kubectl get svc beacon-service -n beacon -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "LoadBalancer Public IPv4: $LB_IP"
          curl -f -s -o /dev/null -w "Health check HTTP status: %{http_code}\n" "http://${LB_IP}/healthz"
          curl -f -s -o /dev/null -w "Tag endpoint HTTP status: %{http_code}\n" "http://${LB_IP}/tag.js"
